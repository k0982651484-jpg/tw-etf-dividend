name: 每日更新ETF資料
on:
  schedule:
    - cron: "40 7 * * 1-5"    # 台灣 15:40(收盤後,證交所/櫃買當日行情出來)
    - cron: "30 13 * * 1-5"   # 台灣 21:30(補配息公告、持股)
  workflow_dispatch:            # 網頁「一鍵更新」或 GitHub 頁面手動觸發
permissions:
  contents: write
concurrency:
  group: etf-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TZ: Asia/Taipei
        run: python -u scripts/update.py
      - name: 存回 repo
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
